# Service frontend untuk ditambahkan ke docker-compose.prod.yml repo backend
# (deploy/README.md). Bukan berkas compose yang berdiri sendiri: potongan di
# bawah disalin ke bagian services, dan dua perubahan pada service caddy
# dicantumkan di komentar.

services:
  frontend:
    build:
      # Path repo frontend di VPS.
      context: /opt/pos-frontend
      args:
        BACKEND_URL: http://backend:4000
    image: pos-frontend:latest
    init: true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  # Perubahan pada service caddy yang sudah ada:
  #   depends_on:
  #     frontend:
  #       condition: service_healthy
  #   environment:
  #     WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN wajib diisi}
